; sl-standin: nr-bridge's sl.interposer.dll. tools\deploy.ps1 copies this file beside it.
; Read once at game start. Log: sl-standin.log in the same folder.
[sl-standin]
; 1: the game does not see NVIDIA adapters (needed: with the 5070 visible the game fails
;    "Ray Tracing initialization"). NVIDIA's own code and the bridge still see them.
HideNvidia=1
; 1: the game does not see Microsoft's software adapter (WARP) either, as with RTInitFix.
HideWarp=1
; 1: report "no ray tracing" to the game, as RTInitFix does. Needed on this rig: with
;    MaskDXR=0 the game still fails "error during Ray Tracing initialization" (run10),
;    even with NVIDIA hidden.
; 0: ray tracing stays available to the game.
MaskDXR=1
Log=1
