; sl-standin: nr-bridge's sl.interposer.dll. tools\deploy.ps1 copies this file beside it.
; Read once at game start. Log: sl-standin.log in the same folder.
[sl-standin]
; 1: the game does not see NVIDIA adapters (needed: with the 5070 visible the game fails
;    "Ray Tracing initialization"). NVIDIA's own code and the bridge still see them.
HideNvidia=1
; 1: the game does not see Microsoft's software adapter (WARP) either, as with RTInitFix.
HideWarp=1
; 0: ray tracing stays available to the game (the default since 2026-10-07: with the NVAPI
;    gate preloaded below, the game no longer sees NVIDIA and ray tracing starts on the AMD card).
; 1: report "no ray tracing" to the game, as RTInitFix does. Only needed with PreloadNvapiGate=0.
MaskDXR=0
; 1: load nvapi-gate (the nvapi64.dll beside this file) as soon as sl-standin loads, so it is the
;    nvapi64.dll the game gets and the game is refused NVAPI. Without it the real System32 copy
;    was loaded first and the gate never ran. 0: old behaviour.
PreloadNvapiGate=1
Log=1
